<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket Prototype</title>
    <style>

    </style>
</head>

<body>
    <p id="currKey">Placeholder text</p>
    <canvas id="mainGameCanvas" width="800" height="600" style="border:1px solid #000000;"></canvas>
    <script src="/socket.io/socket.io.js"></script>
    <script>

        scr = document.getElementById("mainGameCanvas");
        ctx = scr.getContext("2d");
        keyText = document.getElementById("currKey");
        socketId = "";
        const socket = io();

        onkeydown = (event) => {
            socket.emit("KeyDown", event.key, socketId);
        }

        onkeyup = (event) => {
            socket.emit("KeyUp", event.key, socketId);
        }

        socket.on("KeyEvent", (e) => {
            keyText.innerHTML = "Key press event: " + e;
        });

        socket.on("Identify", (id) => {
            socketId = id;
            console.log("ID: " + id);
        });

        socket.on("updateFrame", (players) => {
            ctx.clearRect(0, 0, scr.width, scr.height);
            Object.keys(players).forEach(key => {
                // console.log(players[key].x, players[key].y);
                drawCircle(players[key].x, players[key].y);
            })
        });

        function drawCircle(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 40, 0, 2 * Math.PI);
            ctx.stroke();
        }
    </script>
</body>

</html>

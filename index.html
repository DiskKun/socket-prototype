<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Socket Prototype</title>
    <style>
      
    </style>
  </head>
  <body>
    <p id="currKey">Placeholder text</p>
    <canvas id="mainGameCanvas" width="800" height="600" style="border:1px solid #000000;"></canvas>
    <script src="/socket.io/socket.io.js"></script>
<script>

    scr = document.getElementById("mainGameCanvas");
    ctx = scr.getContext("2d");
    keyText = document.getElementById("currKey");
  const socket = io();
    onkeydown = (event) => { 
        console.log(event.key);
        socket.emit("keyDown", event.key);
    }

    socket.on("key_event", (e) => {
        keyText.innerHTML = "Key press event: " + e;
    });

    socket.on("updateFrame", () => {
        drawRandomCircle();
    });

    function drawRandomCircle() {
        ctx.beginPath();
        ctx.arc(Math.random() * 800, Math.random() * 600, 40, 0, 2 * Math.PI);
        ctx.stroke();
    }
</script>
  </body>
</html>
